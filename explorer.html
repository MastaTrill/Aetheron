<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheron Block Explorer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    h1 { color: #4CAF50; }
    .block { background: #fff; margin: 10px 0; padding: 10px; border-radius: 5px; box-shadow: 0 2px 4px #ccc; }
    .tx { margin-left: 20px; }
  </style>
</head>
<body>
  <h1>Aetheron Block Explorer</h1>
  <p style="text-align: center; color: #666; margin: 20px;">Note: This explorer requires the Aetheron server to be running. <a href="index.html">Return to Home</a></p>
  <div id="blocks"></div>
  <script>
    function renderNotice(message, color) {
      const blocks = document.getElementById('blocks');
      blocks.replaceChildren();
      const p = document.createElement('p');
      p.style.textAlign = 'center';
      p.style.color = color;
      p.textContent = message;
      blocks.appendChild(p);
    }

    function addLine(parent, label, value) {
      const strong = document.createElement('strong');
      strong.textContent = label;
      parent.appendChild(strong);
      parent.appendChild(document.createTextNode(String(value)));
      parent.appendChild(document.createElement('br'));
    }

    function renderBlocks(chain) {
      const blocksDiv = document.getElementById('blocks');
      blocksDiv.replaceChildren();

      chain.forEach((block, i) => {
        const blockDiv = document.createElement('div');
        blockDiv.className = 'block';

        addLine(blockDiv, 'Block #', i);
        addLine(blockDiv, 'Hash: ', block.hash || '-');
        addLine(blockDiv, 'Prev: ', block.previousHash || '-');

        const txLabel = document.createElement('strong');
        txLabel.textContent = 'Txs:';
        blockDiv.appendChild(txLabel);
        blockDiv.appendChild(document.createElement('br'));

        const transactions = Array.isArray(block.transactions) ? block.transactions : [];
        transactions.forEach((tx) => {
          const txDiv = document.createElement('div');
          txDiv.className = 'tx';
          addLine(txDiv, 'From: ', tx.sender || '-');
          addLine(txDiv, 'To: ', tx.receiver || '-');
          addLine(txDiv, 'Amount: ', tx.amount ?? '-');
          addLine(txDiv, 'Fee: ', tx.fee || 0);
          blockDiv.appendChild(txDiv);
        });

        blocksDiv.appendChild(blockDiv);
      });
    }

    async function loadBlocks() {
      try {
        const res = await fetch('http://localhost:3000/chain').catch(() => null);
        if (!res) {
          renderNotice('Server not running. Start with npm start to view live blockchain data.', '#666');
          return;
        }
        const chain = await res.json();
        renderBlocks(Array.isArray(chain) ? chain : []);
      } catch (_error) {
        renderNotice('Error loading blockchain data. Please ensure the server is running.', 'red');
      }
    }
    loadBlocks();
  </script>
</body>
</html>
