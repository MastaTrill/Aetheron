name: Lockfile Repair Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lockfile-repair-evidence.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate root lockfile without installing or running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit validated lockfile to PR branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/v2-governance-handoff-20261017' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: synchronize npm lockfile with package manifest"
            git push origin HEAD:fix/v2-governance-handoff-20261017
          fi
      - name: Upload proposed lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-root-package-lock
          path: package-lock.json
          if-no-files-found: error
