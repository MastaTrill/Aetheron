name: Aetheron CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Build, Lint, Test, and Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Install isolated contract dependencies
        run: npm install --prefix aetheron-contracts --ignore-scripts --no-audit --no-fund

      - name: Compile Contracts
        run: npm run contracts:compile

      - name: Dependency security audit (high and critical)
        run: npm audit --audit-level=high

      - name: Explain skipped Snyk scan
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "Snyk scan not executed - SNYK_TOKEN secret is not configured; npm audit above is the enforced gate"

      # snyk/actions has no v0.4.0 tag; the published tag for that release is 0.4.0.
      - name: Snyk Security Scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@0.4.0
        continue-on-error: true
        with:
          args: --severity-threshold=high
