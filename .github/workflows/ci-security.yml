name: Aetheron CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Build, Lint, Test, and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Lint Code
        run: npm run lint

      - name: Run Unit Tests
        env:
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm run test:unit

      - name: Run SDK Sentinel L3 Tests
        run: node --test sdk/index.test.js

      - name: Compile Contracts
        run: npm --prefix aetheron-contracts install --legacy-peer-deps && npm run contracts:compile

      - name: Security Scan
        run: npm run security:scan
        continue-on-error: true
