name: Aetheron CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Build, Lint, Test, and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Install isolated contract dependencies
        run: npm ci --prefix aetheron-contracts --ignore-scripts --no-audit --no-fund

      - name: Compile Contracts
        run: npm run contracts:compile

      - name: Dependency security audit (high and critical)
        run: npm audit --audit-level=high
